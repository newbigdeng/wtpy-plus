<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="820" viewBox="0 0 1120 820" role="img" aria-labelledby="title desc">
 <title id="title">策略库、风控库与两条回测路径</title><desc id="desc">源码和规则版本进入独立研究或组合计划。原生快速回测与Plus实盘链回放分开运行；行情和资金结果由监控读取。</desc>
 <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker></defs>
 <style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#172033}rect{fill:#f8fafc;stroke:#b8c2d0;stroke-width:1.2}.title{font-size:25px;font-weight:600}.section{font-size:18px;font-weight:600}.name{font-size:17px;font-weight:550}.note{font-size:13px;fill:#576579}.flow{fill:none;stroke:#64748b;stroke-width:1.7;marker-end:url(#arrow)}.rule{fill:#fff9ed;stroke:#dacb9f}</style>
 <rect width="1120" height="820" fill="white" stroke="none"/>
 <text x="32" y="42" class="title">一个源码库，两条回测路径，一份明确的启动计划</text>
 <text x="32" y="78" class="note">策略与规则固定版本；保存和应用不会自动启动交易。</text>
 <text x="32" y="122" class="section">先维护可复用的策略与规则</text>
 <rect x="32" y="143" width="235" height="80" rx="7"/><text x="48" y="175" class="name">策略库</text><text x="48" y="201" class="note">唯一 .py 上传入口 · CTA / HFT / SEL</text>
 <rect x="322" y="143" width="235" height="80" rx="7"/><text x="338" y="175" class="name">独立研究副本</text><text x="338" y="201" class="note">编辑、参数与任务快照</text>
 <rect x="612" y="143" width="235" height="80" rx="7"/><text x="628" y="175" class="name">组合启动计划</text><text x="628" y="201" class="note">固定源码版本、执行器、通道</text>
 <rect x="902" y="143" width="186" height="80" rx="7" class="rule"/><text x="918" y="175" class="name">风控规则库</text><text x="918" y="201" class="note">多选 JSON 规则 · 固定版本</text>
 <path d="M267 184H316" class="flow"/><path d="M149 143V132H729V143" class="flow"/><path d="M902 184H853" class="flow"/><path d="M995 223V251H439V229" class="flow"/>
 <text x="32" y="299" class="section">任务选择原生快速回测，或 Plus 执行链回放</text>
 <rect x="32" y="326" width="235" height="92" rx="7"/><text x="48" y="359" class="name">历史行情目录</text><text x="48" y="385" class="note">WT DMB / DSB · 选择起止日期</text><text x="48" y="405" class="note">Tick、分钟线、日线分开登记</text>
 <rect x="322" y="326" width="235" height="92" rx="7"/><text x="338" y="359" class="name">原生快速回测</text><text x="338" y="385" class="note">CTA / HFT / SEL Mocker</text><text x="338" y="405" class="note">K 线默认只提供闭合事件</text>
 <rect x="322" y="452" width="235" height="92" rx="7"/><text x="338" y="485" class="name">Plus 历史 Tick 回放</text><text x="338" y="511" class="note">实盘 CTA / HFT 引擎与 Python 策略</text><text x="338" y="531" class="note">CTA 可选 MinImpact / TWAP / VWAP</text>
 <rect x="612" y="452" width="235" height="92" rx="7"/><text x="628" y="485" class="name">TraderAdapter → TraderMocker</text><text x="628" y="511" class="note">原生费用、冻结、保证金与拒单</text><text x="628" y="531" class="note">隔离的模拟柜台，不连接 CTP</text>
 <rect x="902" y="326" width="186" height="218" rx="7"/><text x="918" y="359" class="name">任务结果</text><text x="918" y="391" class="note">资金与权益</text><text x="918" y="419" class="note">委托、成交与持仓</text><text x="918" y="447" class="note">风险事件与运行日志</text><text x="918" y="475" class="note">停止状态与退出结果</text><text x="918" y="515" class="note">两种模式独立保存</text>
 <path d="M267 372H316" class="flow"/><path d="M149 418V498H316" class="flow"/><path d="M557 498H606" class="flow"/><path d="M557 372H896" class="flow"/><path d="M847 498H896" class="flow"/>
 <text x="32" y="593" class="section">管理员确认后手动启动，监控读取已有行情和原生账簿</text>
 <rect x="32" y="619" width="235" height="92" rx="7"/><text x="48" y="651" class="name">管理员手动启动组合</text><text x="48" y="677" class="note">停机应用计划 · 保留原 run.py</text><text x="48" y="697" class="note">游客不能启动、修改或下单</text>
 <rect x="322" y="619" width="235" height="92" rx="7"/><text x="338" y="651" class="name">原生引擎与交易通道</text><text x="338" y="677" class="note">数据中台可独立常驻</text><text x="338" y="697" class="note">资金与持仓以柜台回执为准</text>
 <rect x="612" y="619" width="235" height="92" rx="7"/><text x="628" y="651" class="name">FastAPI 与事件推送</text><text x="628" y="677" class="note">读取 DMB / DSB 与账簿</text><text x="628" y="697" class="note">接收 NNG，推送 WebSocket 事件</text>
 <rect x="902" y="619" width="186" height="92" rx="7"/><text x="918" y="651" class="name">Vue 工作台</text><text x="918" y="677" class="note">K 线与 MA / MACD / KDJ</text><text x="918" y="697" class="note">账户权益与风险提示</text>
 <path d="M267 665H316" class="flow"/><path d="M557 665H606" class="flow"/><path d="M847 665H896" class="flow"/>
 <text x="32" y="759" class="note">自定义风控拦截增仓或只告警，减仓与撤单继续可用。原生柜台保护不因取消自定义规则而失效。</text>
 <text x="32" y="789" class="note">源码与依赖进入镜像；账户、历史数据、策略库及任务输出保存在独立数据卷。</text>
</svg>
