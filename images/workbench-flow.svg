" fill="#222">C++ 引擎与数据组件</text><text x="857" y="169" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="15" font-weight="400" fill="#222">接收行情并写入数据</text><path d="M259 149H300" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M529 149H570" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M841 149H800" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow)" /><rect x="35" y="225" width="220" height="75" rx="6" fill="#f6f6f6" stroke="#999" /><text x="47" y="256" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="400" fill="#222">Vue 页面更新</text><text x="47" y="282" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="15" font-weight="400" fill="#222">WebSocket 事件</text><rect x="305" y="225" width="220" height="75" rx="6" fill="#f6f6f6" stroke="#999" /><text x="317" y="256" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="400" fill="#222">Python 事件接收</text><text x="317" y="282" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="15" font-weight="400" fill="#222">接收后推送到网页</text><rect x="575" y="225" width="220" height="75" rx="6" fill="#f6f6f6" stroke="#999" /><text x="587" y="256" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="400" fill="#222">NNG 消息通道</text><text x="587" y="282" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="15" font-weight="400" fill="#222">日志 / 委托 / 成交</text><rect x="845" y="225" width="220" height="75" rx="6" fill="#f6f6f6" stroke="#999" /><text x="857" y="256" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="400" fill="#222">C++ 事件通知</text><text x="857" y="282" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="15" font-weight="400" fill="#222">引擎与交易通道</text><path d="M841 262H800" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M571 262H530" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M301 262H260" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow)" /><text x="35" y="340" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="16" font-weight="400" fill="#222">Python 策略通过原生桥连接 C++；资金查询等少量操作也使用原生接口。</text><text x="35" y="393" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="21" font-weight="600" fill="#222">回测：任务选择快速路径或 Plus 路径</text><rect x="35" y="465" width="200" height="75" rx="6" fill="#f6f6f6" stroke="#999" /><text x="47" y="496" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="400" fill="#222">策略代码编辑器</text><text x="47" y="522" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="15" font-weight="400" fill="#222">CTA / HFT / SEL 模板</text><rect x="280" y="465" width="220" height="75" rx="6" fill="#f6f6f6" stroke="#999" /><text x="292" y="496" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="400" fill="#222">Python 回测任务</text><text x="292" y="522" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="15" font-weight="400" fill="#222">参数 / 子进程 / 停止</text><rect x="560" y="420" width="240" height="75" rx="6" fill="#f6f6f6" stroke="#999" /><text x="572" y="451" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="400" fill="#222">快速：WtBtPorter</text><text x="572" y="477" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="15" font-weight="400" fill="#222">Mocker / CTA 成交模型</text><rect x="560" y="520" width="240" height="75" rx="6" fill="#f6f6f6" stroke="#999" /><text x="572" y="551" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="400" fill="#222">Plus：WtPorter</text><text x="572" y="577" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="15" font-weight="400" fill="#222">实盘引擎 / TraderMocker</text><rect x="865" y="465" width="200" height="75" rx="6" fill="#f6f6f6" stroke="#999" /><text x="877" y="496" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="18" font-weight="400" fill="#222">任务输出与详情</text><text x="877" y="522" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="15" font-weight="400" fill="#222">成交 / 资金 / 日志</text><path d="M239 502H275" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M504 502H525V457H555" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M525 502V557H555" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M804 457H830V502H860" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow)" /><path d="M804 557H830V502H860" stroke="#555" stroke-width="2" fill="none" marker-end="url(#arrow)" /><text x="35" y="640" font-family="Microsoft YaHei,Noto Sans CJK SC,Arial,sans-serif" font-size="16" font-weight="400" fill="#222">账户、数据库和行情保存在数据卷；镜像不携带私人账户。两条回测路径独立运行。</text></svg>